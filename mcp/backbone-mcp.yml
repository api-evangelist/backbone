generated: '2026-07-18'
method: searched
status: published
source: https://backbone.com/llms.txt + https://backbone.com/.well-known/ucp
notes: >-
  Backbone's storefront (backbone.com, a Shopify store) exposes an agent-commerce
  MCP endpoint via the Universal Commerce Protocol (ucp.dev). This is a
  platform-provided (Shopify UCP) shopping server, not a first-party Backbone
  product API. Tools are the documented UCP shopping surface; a live tools/list
  call is Cloudflare bot-challenged, so tool names are taken from the published
  llms.txt agent flow and the /.well-known/ucp capabilities, not fabricated.
server:
  name: backbone-ucp-shopping
  transport: http
  protocol: ucp
  ucp_versions: ['2026-04-08', '2026-01-23']
  url: https://backbone.com/api/ucp/mcp
  canonical_url: https://backbonelabs.myshopify.com/api/ucp/mcp
  spec: https://ucp.dev/2026-04-08/specification/overview/
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
  auth: none for read/discovery; buyer approval required to complete checkout
  rate_limited: true
capabilities:
- dev.ucp.shopping.catalog.search
- dev.ucp.shopping.catalog.lookup
- dev.ucp.shopping.cart
- dev.ucp.shopping.checkout
- dev.ucp.shopping.fulfillment
- dev.ucp.shopping.discount
- dev.ucp.shopping.order
tools:
- name: search_catalog
  description: Find products in the store matching the buyer's intent.
  source: llms.txt agent flow / dev.ucp.shopping.catalog.search
- name: create_cart
  description: Create a cart and add desired items.
  source: llms.txt agent flow / dev.ucp.shopping.cart
- name: create_checkout
  description: Start the purchase flow for a cart.
  source: llms.txt agent flow / dev.ucp.shopping.checkout
- name: update_checkout
  description: Set shipping address and method on a checkout.
  source: llms.txt agent flow / dev.ucp.shopping.fulfillment
- name: complete_checkout
  description: Finalize the purchase — buyer must approve payment.
  source: llms.txt agent flow / dev.ucp.shopping.checkout
