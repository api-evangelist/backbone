name: Backbone
description: >-
  Backbone is a mobile gaming company that makes the Backbone One controller — a
  snap-on gamepad for iPhone and Android — and the Backbone app, a mobile gaming
  platform that unifies a player's game library across cloud gaming, console
  Remote Play, and streaming services with game discovery, capture, and social
  features. The company sells hardware and accessories through a Shopify-hosted
  storefront (backbone.com) that exposes an agent-commerce surface via the
  Universal Commerce Protocol (UCP) MCP endpoint and Shopify Customer Account
  OIDC. Backbone is a portfolio company of Index Ventures. This profile was
  enriched from Backbone's public web surface; the company publishes no
  first-party developer API.
